<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Geonosis" />
  <meta name="theme-color" content="#1a0d08" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <title>Geonosis: Última Defensa</title>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Indicadores en pantalla -->
  <div id="hud" hidden>
    <div id="damage"></div>
    <div id="dmgDir"><div class="wedge"></div></div>
    <div id="crosshair"></div>
    <div id="vitals">
      <div id="hpBar"><div id="hpFill"></div><span id="hpLabel">VIDA 100</span></div>
      <div id="testTag" hidden>MODO PRUEBAS</div>
      <div id="fps" hidden></div>
    </div>
    <div id="roundBox"><div id="roundNum">RONDA 1</div><div id="enemyLeft"></div></div>
    <div id="banner" hidden><div id="bannerTitle"></div><div id="bannerSub"></div></div>
    <div id="hitmark"></div>
    <div id="stance">DE PIE</div>
    <div id="heat"><div id="heatFill"></div><span id="heatLabel">BLÁSTER</span></div>
    <button id="btnPause" aria-label="Pausa">II</button>
  </div>

  <!-- Controles táctiles -->
  <div id="touch" hidden>
    <div id="joyZone"></div>
    <div id="lookZone"></div>
    <button id="btnFire" class="tbtn">DISPARAR</button>
    <button id="btnCrouch" class="tbtn">AGACHARSE</button>
  </div>

  <!-- Menú de inicio / pausa -->
  <div id="menu">
    <div class="panel">
      <h1 id="title">GEONOSIS</h1>
      <h2 id="menuSub">ÚLTIMA DEFENSA</h2>
      <p id="loading">Cargando…</p>
      <button id="btnPlay" class="big" hidden>JUGAR</button>
      <button id="btnQuit" class="ghost" hidden>ABANDONAR PARTIDA</button>
      <p id="best" class="help" hidden></p>

      <div id="settings" hidden>
        <label>Sensibilidad al apuntar
          <span id="sensVal"></span>
          <input id="sens" type="range" min="0.3" max="3" step="0.1" />
        </label>
        <div class="row">
          <span>Calidad gráfica</span>
          <div id="quality" class="seg">
            <button data-q="low">Baja</button>
            <button data-q="medium">Media</button>
            <button data-q="high">Alta</button>
          </div>
        </div>
        <div class="row" style="margin-top:10px">
          <span>Ayuda al apuntar (táctil)</span>
          <div id="assist" class="seg">
            <button data-a="1">Sí</button>
            <button data-a="0">No</button>
          </div>
        </div>
      </div>

      <div id="testPanel" hidden>
        <div class="testTitle">MODO DE PRUEBAS</div>
        <div class="row">
          <span>Empezar en la ronda</span>
          <div class="stepper">
            <button id="roundMinus">−</button><span id="roundVal">1</span><button id="roundPlus">+</button>
          </div>
        </div>
        <div class="row">
          <span>Invencible</span>
          <div id="god" class="seg"><button data-v="1">Sí</button><button data-v="0">No</button></div>
        </div>
        <div class="row">
          <span>Mostrar FPS</span>
          <div id="fpsOpt" class="seg"><button data-v="1">Sí</button><button data-v="0">No</button></div>
        </div>
      </div>

      <p id="help" class="help"></p>
    </div>
  </div>

  <!-- Fin de partida -->
  <div id="gameover" hidden>
    <div class="panel">
      <h1 class="red">HAS CAÍDO</h1>
      <h2>LOS DROIDES TOMAN LA POSICIÓN</h2>
      <div class="stats">
        <div><b id="goRound">1</b><span>Ronda alcanzada</span></div>
        <div><b id="goKills">0</b><span>Droides destruidos</span></div>
      </div>
      <p id="goBest" class="help"></p>
      <button id="btnRetry" class="big">REINTENTAR</button>
      <button id="btnToMenu" class="ghost">MENÚ</button>
    </div>
  </div>

  <div id="rotate"><div>↻<br />Gira el móvil en horizontal</div></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
